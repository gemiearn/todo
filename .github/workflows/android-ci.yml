name: Android CI

on:
  push:
    branches: [ main, master, 'codex/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege: a build / PR job only needs read access to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test and lint
    # Pin the runner image: ubuntu-latest began migrating to Ubuntu 26 on
    # 2026-10-19, and the Compose/Robolectric smoke tests started hanging with
    # AppNotIdleException on that image. Ubuntu 24.04 is the image the suite is
    # known-green on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version_name }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the Gradle Wrapper committed to the repository; no pre-installed
      # Gradle is required. Also caches dependencies (cache is an optimisation,
      # never a build requirement).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version name
        id: meta
        run: |
          VERSION_NAME="$(grep -E '^appVersionName=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \r')"
          echo "version_name=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # 门禁：编译 + lint + 逻辑单测（src/test）。
      # 这三项一直是稳的，红了就是真的红了——构建失败不放过有问题的工程。
      # `--continue`：前面哪一项失败也照样把 lint 报告 / 单测 XML 生成出来，否则下面
      # 的 lint 报告上传永远是空的。
      - name: Build debug APK, lint and logic unit tests
        id: gate
        run: ./gradlew --stacktrace --continue assembleDebug lintDebug testDebugUnitTest -PskipComposeSmoke

      # 后续冒烟会覆盖同一路径，先保存门禁报告以便独立核对提醒回归结果。
      - name: Upload logic unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-unit-test-report-${{ steps.meta.outputs.short_sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      # 整屏组合冒烟（src/testDebug）：把每个页面在 JVM 上真的组合一遍。
      #
      # 它的检查靠 Robolectric 对「布局 / 空闲」的模拟，是整个测试里最不稳的一层：同一份
      # 代码在本机 Windows 上 0.1 秒过，在 CI 的 Linux 上会偶发 `AppNotIdleException`
      # （Compose 等不到空闲，60 秒超时——报的却是 "infinite composition loop"）。这类红
      # 说明不了应用坏了，所以它单独跑、不阻塞构建；失败仍会用 annotation 逐条列出来
      # （见下一步），测试报告也照样上传。
      - name: Compose smoke tests (informational)
        id: smoke
        if: success()
        timeout-minutes: 8
        continue-on-error: true
        run: ./gradlew --stacktrace testDebugUnitTest --tests "com.personal.todo.ui.*SmokeTest"

      # 失败时把具体用例名写成 annotation。Gradle 的失败日志只有「有测试失败」，
      # 不登录也能看到的只有 annotation；这一条让下一次红的时候一眼知道是哪个类、
      # 哪个方法。冒烟那一步的失败用 warning 播报，不把构建判红；门禁的失败仍是 error。
      - name: Report failing unit tests
        if: failure() || steps.smoke.outcome == 'failure'
        env:
          INFORMATIONAL: ${{ steps.smoke.outcome == 'failure' && '1' || '0' }}
        run: |
          python3 - <<'PY' || true
          import glob
          import os
          import xml.etree.ElementTree as ET

          informational = os.environ.get("INFORMATIONAL") == "1"
          level = "warning" if informational else "error"
          note = "（整屏冒烟，非阻塞）" if informational else ""

          found = False
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  found = True
                  name = f"{case.get('classname')}.{case.get('name')}"
                  message = (failure.get("message") or "").strip().splitlines()
                  first = message[0][:300] if message else ""
                  print(f"::{level} title=FAILED::{name} — {first}{note}")
                  print(f"- {'⚠️' if informational else '❌'} `{name}` — {first}{note}")
          if not found:
              print("::warning title=Unit tests::No JUnit XML with failures was found")
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-apk-v${{ steps.meta.outputs.version_name }}-${{ steps.meta.outputs.short_sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ steps.meta.outputs.short_sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ steps.meta.outputs.short_sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7

  signed-debug:
    name: Fixed signing and upgrade verification
    needs: [build, reminder-device]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: signing-certificate.sha256
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-apk-v${{ needs.build.outputs.version }}-${{ needs.build.outputs.short_sha }}
          path: input-apk
      - name: Sign with the persistent app certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')
          if any(not os.environ.get(n) for n in names):
              raise SystemExit('Fixed signing Secrets are required; refusing to publish a temporary-signature APK.')
          path = Path(os.environ['RUNNER_TEMP']) / 'todo-fixed.p12'
          with path.open('wb') as f:
              os.chmod(path, 0o600)
              f.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          PY
          mkdir -p signed-apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/todo-fixed.p12" --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD --out signed-apk/app-debug.apk input-apk/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs signed-apk/app-debug.apk | tee signed-apk/signature.txt
          EXPECTED="$(tr -d '\r\n ' < signing-certificate.sha256)"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signed-apk/signature.txt)"
          test "$ACTUAL" = "$EXPECTED"
      - name: Find the preceding fixed-signature build
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listArtifactsForRepo({...context.repo, per_page: 100});
            const previous = data.artifacts.find(a => !a.expired &&
              a.name.startsWith('app-debug-fixed-v') && a.workflow_run?.id !== context.runId);
            if (!previous) { core.setOutput('found', 'false'); return; }
            const result = await github.rest.actions.downloadArtifact({...context.repo, artifact_id: previous.id, archive_format: 'zip'});
            require('fs').writeFileSync('previous.zip', Buffer.from(result.data));
            core.setOutput('found', 'true');
            core.info(`Previous signed artifact: ${previous.name}`);
      - name: Verify preceding certificate
        if: steps.previous.outputs.found == 'true'
        run: |
          set -euo pipefail
          unzip -q previous.zip -d previous-apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs previous-apk/app-debug.apk > previous-cert.txt
          EXPECTED="$(tr -d '\r\n ' < signing-certificate.sha256)"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' previous-cert.txt)"
          test "$ACTUAL" = "$EXPECTED"
      - name: Enable KVM for installation verification
        if: steps.previous.outputs.found == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the preceding APK and retain app data
        if: steps.previous.outputs.found == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install previous-apk/app-debug.apk
            adb shell "run-as com.personal.todo sh -c 'mkdir -p files && echo retained > files/signing-upgrade-proof'"
            adb install -r signed-apk/app-debug.apk
            test "$(adb shell run-as com.personal.todo cat files/signing-upgrade-proof | tr -d '\r')" = retained
      - name: Upload fixed-signature APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-fixed-v${{ needs.build.outputs.version }}-${{ needs.build.outputs.short_sha }}
          path: signed-apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/todo-fixed.p12"

  reminder-device:
    name: Reminder on Android ${{ matrix.api }} with screen off
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build device test APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Deliver a reminder with screen off and device idle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --stacktrace connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.personal.todo.notification.ReminderDeviceTest
      - name: Upload reminder device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reminder-device-report-api${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 7
