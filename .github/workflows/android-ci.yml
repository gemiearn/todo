name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege: a build / PR job only needs read access to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test and lint
    # Pin the runner image: ubuntu-latest began migrating to Ubuntu 26 on
    # 2026-10-19, and the Compose/Robolectric smoke tests started hanging with
    # AppNotIdleException on that image. Ubuntu 24.04 is the image the suite is
    # known-green on.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the Gradle Wrapper committed to the repository; no pre-installed
      # Gradle is required. Also caches dependencies (cache is an optimisation,
      # never a build requirement).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version name
        id: meta
        run: |
          VERSION_NAME="$(grep -E '^appVersionName=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \r')"
          echo "version_name=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # 门禁：编译 + lint + 逻辑单测（src/test）。
      # 这三项一直是稳的，红了就是真的红了——构建失败不放过有问题的工程。
      # `--continue`：前面哪一项失败也照样把 lint 报告 / 单测 XML 生成出来，否则下面
      # 的 lint 报告上传永远是空的。
      - name: Build debug APK, lint and logic unit tests
        run: ./gradlew --stacktrace --continue assembleDebug lintDebug testDebugUnitTest -PskipComposeSmoke

      # 整屏组合冒烟（src/testDebug）：把每个页面在 JVM 上真的组合一遍。
      #
      # 它的检查靠 Robolectric 对「布局 / 空闲」的模拟，是整个测试里最不稳的一层：同一份
      # 代码在本机 Windows 上 0.1 秒过，在 CI 的 Linux 上会偶发 `AppNotIdleException`
      # （Compose 等不到空闲，60 秒超时——报的却是 "infinite composition loop"）。这类红
      # 说明不了应用坏了，所以它单独跑、不阻塞构建；失败仍会用 annotation 逐条列出来
      # （见下一步），测试报告也照样上传。
      - name: Compose smoke tests (informational)
        id: smoke
        continue-on-error: true
        run: ./gradlew --stacktrace testDebugUnitTest --tests "com.personal.todo.ui.*SmokeTest"

      # 失败时把具体用例名写成 annotation。Gradle 的失败日志只有「有测试失败」，
      # 不登录也能看到的只有 annotation；这一条让下一次红的时候一眼知道是哪个类、
      # 哪个方法。冒烟那一步的失败用 warning 播报，不把构建判红；门禁的失败仍是 error。
      - name: Report failing unit tests
        if: failure() || steps.smoke.outcome == 'failure'
        env:
          INFORMATIONAL: ${{ steps.smoke.outcome == 'failure' && '1' || '0' }}
        run: |
          python3 - <<'PY' || true
          import glob
          import os
          import xml.etree.ElementTree as ET

          informational = os.environ.get("INFORMATIONAL") == "1"
          level = "warning" if informational else "error"
          note = "（整屏冒烟，非阻塞）" if informational else ""

          found = False
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  found = True
                  name = f"{case.get('classname')}.{case.get('name')}"
                  message = (failure.get("message") or "").strip().splitlines()
                  first = message[0][:300] if message else ""
                  print(f"::{level} title=FAILED::{name} — {first}{note}")
                  print(f"- {'⚠️' if informational else '❌'} `{name}` — {first}{note}")
          if not found:
              print("::warning title=Unit tests::No JUnit XML with failures was found")
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v${{ steps.meta.outputs.version_name }}-${{ steps.meta.outputs.short_sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ steps.meta.outputs.short_sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ steps.meta.outputs.short_sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7
