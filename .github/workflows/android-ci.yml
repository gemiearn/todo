name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege: a build / PR job only needs read access to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the Gradle Wrapper committed to the repository; no pre-installed
      # Gradle is required. Also caches dependencies (cache is an optimisation,
      # never a build requirement).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version name
        id: meta
        run: |
          VERSION_NAME="$(grep -E '^appVersionName=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \r')"
          echo "version_name=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # A failure in any of these tasks fails the job - no green build on a
      # broken project.
      - name: Build debug APK, run unit tests and lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug

      # 失败时把具体用例名写成 annotation。Gradle 的失败日志只有「有测试失败」，
      # 不登录也能看到的只有 annotation；这一条让下一次红的时候一眼知道是哪个类、
      # 哪个方法。
      - name: Report failing unit tests
        if: failure()
        run: |
          python3 - <<'PY' || true
          import glob
          import xml.etree.ElementTree as ET

          found = False
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  found = True
                  name = f"{case.get('classname')}.{case.get('name')}"
                  message = (failure.get("message") or "").strip().splitlines()
                  first = message[0][:300] if message else ""
                  print(f"::error title=FAILED {name}::{first}")
                  print(f"- ❌ `{name}` — {first}")
          if not found:
              print("::warning title=Unit tests::No JUnit XML with failures was found")
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v${{ steps.meta.outputs.version_name }}-${{ steps.meta.outputs.short_sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ steps.meta.outputs.short_sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ steps.meta.outputs.short_sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7
