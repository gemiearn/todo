# Gradle / JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# App versioning - single source of truth.
# app/build.gradle.kts reads these; the CI workflow reads appVersionName
# to build the artifact name (version + commit SHA).
# versionName is three numbers: 0.1.4 -> ... -> 0.1.9 -> 0.2.0.
# versionCode is a plain monotonic integer, bumped on every version.
appVersionCode=34
appVersionName=0.4.4
